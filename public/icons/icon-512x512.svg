<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8F1028"/>
      <stop offset="100%" stop-color="#690D20"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD566"/>
      <stop offset="100%" stop-color="#FFC83D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="113" fill="url(#bg)"/>

  <!-- Gold Accent Inner Border -->
  <rect x="15" y="15" width="481" height="481" rx="109" fill="none" stroke="#FFC83D" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Shopping Bag Icon & Retail Motif -->
  <g transform="translate(41, 41)" filter="url(#shadow)">
    <!-- Bag Body -->
    <path d="M 86 150.5 
             L 344 150.5 
             L 369.8 369.8 
             Q 369.8 395.6 344 395.6
             L 86 395.6 
             Q 60.2 395.6 60.2 369.8
             Z" fill="url(#gold)"/>

    <!-- Bag Handles -->
    <path d="M 150.5 150.5 
             C 150.5 51.6, 279.5 51.6, 279.5 150.5" 
          fill="none" stroke="#FFFFFF" stroke-width="30.1" stroke-linecap="round"/>

    <!-- Bag Inner Cutout Detail -->
    <path d="M 172 150.5 
             C 172 86, 258 86, 258 150.5" 
          fill="none" stroke="#690D20" stroke-width="17.2" stroke-linecap="round"/>

    <!-- Shree Seva "SS" Monogram in Center of Bag -->
    <text x="215" y="292.40000000000003" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="103.2" 
          font-weight="900" 
          fill="#8F1028" 
          text-anchor="middle" 
          letter-spacing="8.6">SS</text>
  </g>
</svg>