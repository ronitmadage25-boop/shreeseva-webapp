<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8F1028"/>
      <stop offset="100%" stop-color="#690D20"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD566"/>
      <stop offset="100%" stop-color="#FFC83D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Gold Accent Inner Border -->
  <rect x="6" y="6" width="180" height="180" rx="38" fill="none" stroke="#FFC83D" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Shopping Bag Icon & Retail Motif -->
  <g transform="translate(15, 15)" filter="url(#shadow)">
    <!-- Bag Body -->
    <path d="M 32.4 56.699999999999996 
             L 129.6 56.699999999999996 
             L 139.32 139.32 
             Q 139.32 149.04000000000002 129.6 149.04000000000002
             L 32.4 149.04000000000002 
             Q 22.680000000000003 149.04000000000002 22.680000000000003 139.32
             Z" fill="url(#gold)"/>

    <!-- Bag Handles -->
    <path d="M 56.699999999999996 56.699999999999996 
             C 56.699999999999996 19.439999999999998, 105.3 19.439999999999998, 105.3 56.699999999999996" 
          fill="none" stroke="#FFFFFF" stroke-width="11.340000000000002" stroke-linecap="round"/>

    <!-- Bag Inner Cutout Detail -->
    <path d="M 64.8 56.699999999999996 
             C 64.8 32.4, 97.2 32.4, 97.2 56.699999999999996" 
          fill="none" stroke="#690D20" stroke-width="6.48" stroke-linecap="round"/>

    <!-- Shree Seva "SS" Monogram in Center of Bag -->
    <text x="81" y="110.16000000000001" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="38.879999999999995" 
          font-weight="900" 
          fill="#8F1028" 
          text-anchor="middle" 
          letter-spacing="3.24">SS</text>
  </g>
</svg>